[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "gpkmeans"
version = "0.1.0"
description = "Noise-aware group-penalty k-means for LLM-constrained text clustering"
readme = "README.md"
requires-python = ">=3.8"
license = {text = "MIT"}
dependencies = [
  "numpy>=1.21",
  "requests>=2.28",
]

[tool.setuptools]
packages = ["gpkmeans"]
